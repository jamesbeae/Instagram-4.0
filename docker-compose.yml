services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: Instagram
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - instagram_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Instagram"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    profiles: [app]
    build: ./Source_Code/backend
    restart: unless-stopped
    env_file: ./Source_Code/backend/.env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/Instagram
      PORT: 8000
      PUBLIC_API_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["instagram_uploads:/app/uploads"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    profiles: [app]
    build: ./Source_Code/frontend
    restart: unless-stopped
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
volumes:
  instagram_postgres_data:
  instagram_uploads:
